# import-linter config. Save as `.importlinter` at the repo root, or move the
# sections into pyproject.toml under [tool.importlinter] (contracts become
# [[tool.importlinter.contracts]] tables).
#
# Run with: lint-imports
#
# Replace `myapp` with your root package, and pkg_a/pkg_b with your real
# feature packages. Add one "internals private" contract per feature package.

[importlinter]
root_package = myapp
# include_external_packages = True   # uncomment if you also want to constrain
                                     # imports of third-party packages

# --- Contract 1: each package's internals are private ----------------------
# Nothing OUTSIDE pkg_a may import pkg_a._internal. Sources list the OTHER
# packages (and any composition roots like myapp.cli / myapp.api), never
# pkg_a itself, so intra-package imports stay free.

[importlinter:contract:pkg-a-internals-private]
name = pkg_a internals are private
type = forbidden
source_modules =
    myapp.pkg_b
    myapp.cli
forbidden_modules =
    myapp.pkg_a._internal
allow_indirect_imports = False

[importlinter:contract:pkg-b-internals-private]
name = pkg_b internals are private
type = forbidden
source_modules =
    myapp.pkg_a
    myapp.cli
forbidden_modules =
    myapp.pkg_b._internal
allow_indirect_imports = False

# --- Contract 2: feature packages are independent --------------------------
# Feature packages don't import each other directly; shared code goes in a
# `common`/`core` package they both depend on. Relax this if you deliberately
# layer instead (see the layers stub below).

[importlinter:contract:features-independent]
name = Feature packages are independent
type = independence
modules =
    myapp.pkg_a
    myapp.pkg_b

# --- Contract 3 (stub): architectural layers -------------------------------
# Uncomment and order highest-level first. Higher layers may import lower
# ones, never the reverse. This is where you encode "which package may depend
# on which" for THIS repo.
#
# [importlinter:contract:layers]
# name = Architectural layers
# type = layers
# layers =
#     myapp.cli
#     myapp.pkg_a
#     myapp.pkg_b
#     myapp.common
